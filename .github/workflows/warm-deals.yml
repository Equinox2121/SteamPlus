name: Warm AKS deals

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warm-deals
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper
        run: npm install --no-save allkeyshop-api@latest

      - name: Run warmer
        run: node scripts/warmDeals.js

      - name: Upload to deals-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deals-latest
          name: 'Latest deals snapshot'
          body: 'Auto-generated by warm-deals workflow.'
          files: dist/deals.json
          make_latest: 'false'
          prerelease: false
